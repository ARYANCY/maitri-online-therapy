<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Maitri</title>
    <style>
      /* Prevent FOUC - hide content until styles are loaded */
      #root:not(.styles-loaded) {
        visibility: hidden;
        opacity: 0;
      }
      /* Show loading indicator while styles load */
      #root:not(.styles-loaded)::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #fff;
        z-index: 9999;
      }
      /* Smooth transition when styles are loaded */
      #root.styles-loaded {
        visibility: visible;
        opacity: 1;
        transition: opacity 0.1s ease-in;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
