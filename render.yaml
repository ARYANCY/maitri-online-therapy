services:
  - type: static
    name: maitri-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://maitri-online-therapy.onrender.com
      - key: NODE_ENV
        value: production

